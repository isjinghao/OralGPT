template: |
  You are measuring EVIDENCE RECALL for a model's ANSWER to a clinical question.

  For EACH item in SELECTED EVIDENCE, decide whether the MODEL ANSWER covers that clinical fact
  (states the same fact; synonymous clinical phrasing is fine), using the REFERENCE ANSWER as ground
  truth. Every listed evidence item was preselected during task construction as required for this
  task and MUST be judged for coverage. Do not add a scope judgment or exclude any item. Return ONLY
  the ids of the covered items, no explanations.

  Clinical semantic equivalence:
  - Accept clinically equivalent paraphrases. Verify the anatomical structure and level (skeletal, dental, or soft tissue), and preserve key qualifiers, including laterality, direction, negation, severity, and diagnostic certainty. Consider examination modality and time point when relevant.Related findings cannot replace the target finding. Do not infer missing information. Apply numerical tolerances only to the same measurement and anatomical site.

  Numeric tolerance:
  - Linear measurements (mm): direction/sign/laterality must match; magnitude acceptable within ±2 mm OR ±20% of the reference (whichever is larger).
  - Angles (degrees): within ±3° and matching qualitative descriptor (acute/obtuse/normal, high/low-angle). Apply numerical tolerances only when the answer refers to the same measurement and anatomical site. When the sign, direction, or diagnostic category is clinically relevant, it must also match. Numerical proximity alone is insufficient for credit.
  - Categorical / classification (Class I/II/III, left/right, presence/absence): must match EXACTLY.

  QUESTION:
  $question

  REFERENCE ANSWER:
  $gold

  MODEL ANSWER:
  $answer

  SELECTED EVIDENCE (JSON list):
  $selected_evidence

  Return strict JSON only, no markdown, no commentary:
  {"covered_evidence_ids": ["<id>"]}
