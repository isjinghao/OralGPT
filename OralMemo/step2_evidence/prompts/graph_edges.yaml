template: |
  You are proposing cross-stage clinical evidence links.

  Propose candidate pairs where an earlier fact may help interpret a later fact through confirmation, remeasurement, refinement, conflict, a supported clinical-state update, or clinically meaningful corroboration. Related findings across modalities or fields may be linked when they jointly support the same specific clinical interpretation. A different value alone does not prove an update. Do not propose pairs based only on an unrelated shared category or simple coexistence.

  Rules:
  1. Each pair goes from an earlier node to a later node.
  2. Preserve entity, anatomical level, scope, direction, polarity, and uncertainty.
  3. Use only provided ids. Do not infer facts beyond the nodes.
  4. Give each pair a fact-specific English reason of at most 15 words.
  5. Return at most $max_edges candidates.

  Return strict JSON only:
  {
    "candidates": [
      {"source": "<node_id>", "target": "<node_id>", "reason": "..."}
    ]
  }

  Patient: $patient_id

  Stage order:
  $stage_order

  Evidence nodes:
  $nodes
