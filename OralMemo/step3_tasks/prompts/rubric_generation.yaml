template: |
  You are writing a scoring rubric for an OralMemBench diagnosis or treatment task.

  Given the task type, the clinical question, the gold answer, and the supporting evidence,
  design a rubric that grades a model answer against the gold answer. The rubric must reflect the
  clinically important components of THIS specific gold answer (do not use generic boilerplate that
  is unsupported by the answer).

  Clinical axes to organise the criteria around (orthognathic / craniomaxillofacial):
  - Occlusal relationship / function.
  - Facial aesthetics (may combine frontal symmetry and lateral profile into one criterion; no need to
    over-subdivide).
  - Dental disease diagnosis / treatment (caries, impacted / wisdom teeth, periodontitis, endodontic and
    restorative status, etc.).
  - For DIAGNOSIS tasks: the rubric MUST cover BOTH (a) the deformity / skeletal specialty diagnosis
    (skeletal & dental malocclusion, asymmetry, vertical/transverse pattern) AND (b) the dental disease
    diagnosis, as separate criteria, so a gap in either is scored distinctly.
  - For TREATMENT tasks: include a criterion for the OVERALL treatment pathway and its sequencing/reasoning
    (presurgical orthodontics -> orthognathic surgery -> postsurgical orthodontics -> dental disease
    management), not only the surgical technique.

  Rules:
  1. Produce 4-7 criteria whose scores sum to exactly 100.
  2. Each criterion targets one clinically meaningful component actually present in the gold answer.
  3. Do NOT give a minor single procedure its own high-weight criterion (e.g. do not make
     "extraction of impacted teeth" a standalone criterion); fold it into the broader dental-disease
     treatment criterion.
  4. description explains what a correct answer must contain for that criterion.
  5. Return strict JSON only.

  Return schema:
  {
    "max_score": 100,
    "criteria": [
      {"name": "...", "score": 0, "description": "..."}
    ]
  }

  Task type: $task_type

  Question:
  $question

  Gold answer:
  $answer

  Supporting evidence (id | stage | modality | fact):
  $evidence_text
