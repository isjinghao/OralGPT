template: |
  You are a clinical assessment specialist writing a scoring rubric for a treatment or follow-up reasoning task.

  Given only the task type, clinical question, and authoritative gold answer, design a rubric that
  grades a model answer against the gold answer. Derive every scoring criterion from the question and
  this specific gold answer; do not use atomic evidence and do not add unsupported generic requirements.

  Rules:
  1. Produce 4-7 criteria whose scores sum to exactly 100.
  2. Derive every criterion from a clinically meaningful component actually required by the question
     and present in the gold answer. Do not add external requirements.
  3. Cover every major requested branch, comparison, sequence, alternative, and limitation. Assign
     meaningful weight to each major branch so omitting one cannot still earn near-full credit. Score
     interchangeable alternatives within one branch, not as cumulative requirements.
  4. Weight criteria by clinical importance and question emphasis. An umbrella criterion must stay
     concise and must not rescore details covered elsewhere.
  5. Preserve certainty, scope, dependencies, ordering, necessity, and optionality exactly. Required
     conjunctions need all components; alternatives allow any stated option; optional components are not required.
  6. Keep independently gradable components separate when possible. If details are grouped, state how
     partial credit follows the correctly covered subcomponents.
  7. Avoid high weight for a minor detail unless the question or gold answer makes it central.
  8. Descriptions must allow clinically equivalent wording while retaining the required meaning.
  9. Before returning, verify complete branch coverage, non-overlapping scoring, logical fidelity,
     explicit partial-credit behavior, and an exact total of 100.
  10. Return strict JSON only.

  Return schema:
  {
    "max_score": 100,
    "criteria": [
      {"name": "...", "score": 0, "description": "..."}
    ]
  }

  Task type: $task_type

  Question:
  $question

  Gold answer:
  $answer
