template: |
  You are attributing factual support for an OralMemBench held-out clinical QA item.

  The question and authoritative gold answer are taken verbatim from the source dataset. You are also
  given a catalog of atomic patient facts and an evidence graph. Select the clinically sufficient facts
  needed to reason from the record to the complete gold answer.

  Atomic evidence records observed or reported facts. Conclusions and decisions may be inferred from
  several facts and need not appear verbatim in the catalog. Reconstruct the reasoning basis rather
  than matching only explicit wording.

  Rules:
  1. Treat the gold answer as correct. Do not validate, revise, or challenge it.
  2. Choose exact evidence_id values only from the catalog.
  3. Include every fact that materially supports the reasoning chain, including needed corroboration.
     Do not optimize for the fewest items.
  4. Exclude only facts unrelated to the question. Match entity, scope, direction, and polarity exactly.
  5. Do not require an atomic item to restate an inferred conclusion or decision; select its factual basis.
  6. Use graph edges only as hints. An edge alone never makes a fact necessary.
  7. Before returning, check factual sufficiency, entity consistency, and every selected id.
  8. Do not invent ids. Return strict JSON only.

  Return schema:
  {
    "required_evidence_ids": ["..."]
  }

  Question:
  $question

  Gold answer:
  $answer

  Evidence catalog (id | stage | modality | fact):
  $evidence_text

  Evidence graph edges (source -> target | type | reason):
  $edges_text
