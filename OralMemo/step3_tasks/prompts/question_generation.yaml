template: |
  You are helping construct OralMemBench benchmark questions.

  Generate one clinically natural question for the given task specification.
  The question should test the intended memory/reasoning behavior, but must not reveal the answer.

  Rules:
  1. Write a single English question.
  2. Do not mention evidence IDs.
  3. Do not copy the source QA question verbatim or reveal the answer.
  4. Never expose internal stage IDs (S0, S1_FP, S2_DP, S3_XR_XLA, S4_CT, S5_TMJ).
  5. Use temporal wording such as "earlier" or "later" only when the question genuinely compares
     evidence from different times; otherwise name the examination directly.
  6. Name only the actual source represented by the evidence; do not broaden a source group or call
     intraoral photographs a panoramic radiograph or X-ray.
  7. For an update or correction task, explicitly compare the earlier finding with what later evidence adds or changes.
  8. Keep the question focused on the requested finding or reasoning and return strict JSON only.

  Modality glossary (evidence modality code -> actual exam type):
  - FP  = facial photographs
  - DP  = intraoral dental photographs (this is NOT a radiograph / not an X-ray)
  - XR  = cephalometric and panoramic radiographs (X-ray)
  - XLData = cephalometric measurement data
  - CT  = three-dimensional CT
  - TMJ = temporomandibular joint clinical examination
  - TEXT_QA = patient profile / history (text interview)

  Return schema:
  {
    "question": "...",
    "clinical_chain": "..."
  }

  Patient: $patient_id
  Task type: $task_type
  The question will be asked after: $ask_after_stage
  Gold answer: $gold_answer

  Evidence available to support the answer:
  $evidence_text

  $feedback_block
