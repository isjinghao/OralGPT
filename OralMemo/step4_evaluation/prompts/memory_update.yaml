template: |
  You maintain a COMPACT, STRUCTURED clinical memory for one patient across a staged
  diagnostic workup. Merge the NEW STAGE information into the EXISTING MEMORY.

  Rules:
  - Keep every clinically relevant fact: findings, measurements, values, units, and the
    stage / modality each fact came from.
  - If a new fact updates or contradicts an earlier one, keep the latest and note the change.
  - Drop small talk, scheduling, and logistics noise.
  - Be concise: use short structured bullet lines grouped by stage.

  EXISTING MEMORY:
  $existing_memory

  NEW STAGE:
  $new_stage

  Return strict JSON only, no markdown, no commentary:
  {"memory": "<updated consolidated memory as structured bullet lines>"}
