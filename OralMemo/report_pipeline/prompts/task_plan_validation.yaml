template: |
  You are validating a batch of case-report benchmark task plans against one shared evidence catalog. A report may contain any number of timepoints and may be text-only.

  For each candidate independently, use only evidence IDs listed for its ask_after_stage in available_evidence_ids_by_stage.

  Validate:
  1. The gold answer is fully entailed by selected evidence and does not omit directly conflicting available evidence.
  2. Entity, anatomy, scope, direction, polarity, timing, uncertainty, and numeric values match the evidence.
  3. recall asks for previously released facts; cross_temporal requires evidence from at least two different timepoints and a supported temporal relationship; update requires evidence from different stages and a real change, refinement, or explicit conflict rather than mere repetition.
  4. Modality is only the source channel, TEXT_QA or FIGURE_QA. Source wording may name the actual examination or figure type stated in the evidence.
  5. Qualitative impressions must not override conflicting objective measurements.
  6. The answer is concise, clinically coherent, and contains no unsupported detail.

  A candidate is repairable only when its task type and core reasoning are valid and the problem can be fixed locally by changing selected evidence IDs or trimming/correcting the gold answer. Typical repairable problems are one missing evidence item, one unsupported detail, or a small entity/scope/polarity mismatch. A false novelty/update, wrong task type, or invalid core reasoning is not repairable.

  For a repairable candidate, provide the complete corrected evidence ID list and/or complete corrected gold answer. Set accepted=false and repairable=true. Otherwise omit the fixed fields.

  Return strict JSON only:
  {
    "results": [
      {
        "task_id": "...",
        "accepted": true,
        "repairable": false,
        "feedback": "...",
        "issues": [{"problem": "...", "evidence_ids": ["..."]}],
        "fixed_required_evidence_ids": null,
        "fixed_gold_answer": null
      }
    ]
  }

  Return exactly one result for every candidate.

  Batch:
  $plan_json
