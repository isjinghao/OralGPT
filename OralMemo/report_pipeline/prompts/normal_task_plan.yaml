task_types:
  - task_type: modality_perception
    count: 3
    instruction: >-
      Read a finding directly reported by one source at one timepoint; required
      evidence should come from a single timepoint.

  - task_type: longitudinal_evidence_recall
    count: 2
    instruction: >-
      Retrieve earlier evidence needed in a later clinical context; the answer
      must identify that earlier context and use at least two timepoints. Do not
      turn recall into a new integrated interpretation, state update, or outcome summary.

  - task_type: cross_modal_reasoning
    count: 2
    instruction: >-
      Integrate complementary evidence across different modalities, clinically
      distinct sources, or timepoints to derive one supported interpretation;
      each selected item must materially contribute rather than merely repeat another.

  - task_type: memory_update_conflict_correction
    count: 2
    instruction: >-
      Explain how later evidence adds to or revises the stored clinical state;
      required evidence should span at least two timepoints. The answer must
      state the added or revised fact. Confirmation, generic comparison,
      longitudinal recall, and outcome summary are not updates.
