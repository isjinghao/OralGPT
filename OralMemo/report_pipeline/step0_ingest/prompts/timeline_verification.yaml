template: |
  You are a strict medical fact-checker for a longitudinal oral/dental case-report benchmark.
  You are given (A) the SOURCE report text, its timeline table(s), AND its FIGURE CAPTIONS, and
  (B) a structured timeline extracted from it. Verify (B) against (A) ONLY. No outside knowledge.

  WHAT COUNTS AS SOURCE (A): the full text, the timeline table(s), AND the figure captions below
  are ALL part of the source. A fact stated in a figure caption IS supported (do not flag it as invented).

  CRITICAL ANTI-FALSE-ALARM RULES:
  - Do NOT compute, add up, or infer totals yourself. If the source explicitly states a number
    (e.g. "a total of 47 visits"), treat that number as CORRECT. Only flag a number as wrong when
    the source explicitly states a DIFFERENT value for the same quantity.
  - Before flagging something as "NOT FOUND", search ALL of (A): full text + tables + figure captions.
  - Only flag content that truly contradicts the source or is absent from ALL of (A).

  Check for:
  1. Factual support: every "statement", "decision", "rationale", and each held_out field must be
     supported somewhere in (A). Flag only genuinely unsupported/invented/altered content.
  2. Numeric fidelity: numbers, units, %, tooth numbers (FDI), dates, gene/variants must match (A)
     exactly (prefer the TABLE when narrative and table differ for the same quantity).
  3. Internal logical consistency across timepoints (e.g. a tooth described as extracted at one
     timepoint yet present/mobile later WITHOUT explanation). Flag real contradictions only.
  4. Chronology: timepoints in non-decreasing time order; t_months plausible.
  5. Leakage/over-claiming in held_out (must reflect the source).

  Severity:
  - "high": a real factual error, a wrong/invented number, or a logical contradiction.
  - "medium": an unsupported or imprecise claim, or a chronology issue.
  - "low": stylistic/formatting only.

  Return STRICT VALID JSON ONLY:
  {
    "passed": true or false,        // false if ANY high-severity issue exists
    "issues": [
      {"severity": "high|medium|low",
       "location": "timepoint label / topic / held_out field",
       "problem": "what is wrong",
       "source_evidence": "short quote from (A) proving the correct value, or 'NOT FOUND IN SOURCE'",
       "suggested_fix": "concrete instruction to correct the extraction"}
    ]
  }

  ===== SOURCE (A): FIGURE CAPTIONS =====
  $figures_block

  ===== EXTRACTED TIMELINE (B) TO VERIFY =====
  $timeline_json

  ===== SOURCE (A): TIMELINE TABLE(S) =====
  $tables_text

  ===== SOURCE (A): FULL TEXT =====
  $fulltext
