template: |
  You are verifying a longitudinal timeline extracted from one oral or dental case report.
  Compare the timeline only with the supplied text, tables, and figure captions. Do not use outside knowledge or infer unstated facts.

  Check:
  1. Every answer is supported, stays close to complete source wording, preserves important values and negations, and does not retain obvious spacing/layout artifacts; prefer tables when sources conflict and never guess unclear values.
  2. Questions match their answers and timepoints without revealing the answer.
  3. The earliest stated event is a separate first timepoint with t_months=0; every later t_months is a non-negative integer elapsed from that same origin and never resets for treatment. Events less than one month apart may share the same integer value. Later timepoints are complete and chronological, and stage_type follows perception -> treatment -> followup. Staged treatment remains treatment through the final procedure or restoration. Visits reported together without distinct findings remain one combined timepoint rather than duplicated QAs.
  4. Perception uses observations only; treatment uses evaluations only and covers the supported plans, procedures, choices, checks, and rationales without a fixed count; each followup lists observations before supported state and management evaluations.
  5. Each clinically relevant available figure linked to perception or followup has one comprehensive image QA covering its body-linked visual findings. It is not caption-only, appears before overlapping text that would reveal it, and keeps non-visual measurements or interpretations in text observations.
  6. Evaluation QAs have figure_ref=null, and evaluation answers from the same batch are not exposed to one another.

  Severity:
  - high: factual error, invented or wrong value, or contradiction.
  - medium: unsupported/imprecise content, role/stage/image-rule error, or chronology problem.
  - low: wording or formatting only.

  Return strict valid JSON only:
  {
    "passed": true,
    "issues": [
      {
        "severity": "high|medium|low",
        "location": "timepoint or QA",
        "problem": "problem description",
        "source_evidence": "short source quote or NOT FOUND IN SOURCE",
        "suggested_fix": "specific correction"
      }
    ]
  }

  ===== FIGURE CAPTIONS =====
  $figures_block

  ===== TIMELINE TO VERIFY =====
  $timeline_json

  ===== SOURCE TABLES =====
  $tables_text

  ===== SOURCE TEXT =====
  $fulltext
