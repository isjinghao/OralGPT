template: |
  You are verifying a longitudinal timeline extracted from one oral or dental case report.
  Compare the timeline only with the supplied text, tables, and figure captions. Do not use outside knowledge or infer unstated facts.

  Check:
  1. Every answer is supported, stays close to complete source wording, preserves important values and negations, and does not retain obvious spacing/layout artifacts; prefer tables when sources conflict and never guess unclear values.
  2. Questions match their answers and timepoints without revealing the answer.
  3. Audit the entire time axis against every explicit date, elapsed-time statement, duration, and total follow-up anchor. The earliest reliably anchored clinical event is the first timepoint with t_months=0; if the report is entirely relative, use its earliest ordered event. Undated prior history may be included with the first anchored presentation without assigning it that date and must not create an artificial origin that makes explicit later dates uncomputable. A later t_months is a non-negative integer only when an explicit date or anchored date/duration chain supports elapsed months from that origin; null is correct when clinical order is clear but absolute elapsed months cannot be recovered reliably. The timepoints array order expresses chronology, so do not require a guessed integer for treatment-cycle counts or disconnected relative phrases. Never reset the origin for treatment. Resolve incompatible source anchors by priority: exact calendar dates and date chains first, exact elapsed durations second, and approximate total-follow-up phrases such as "about", "over", or "long-term" only as supporting context. When the timeline follows the highest-priority anchor but the source itself remains irreconcilable, report one low-severity issue whose problem starts with "source_conflict:" and do not request another t_months change. Reject an integer t_months only when it violates the highest-priority applicable anchor, and reject null only when an absolute month is reliably recoverable. A treatment duration is local and may overlap other care; add durations only when the source explicitly makes them sequential. Events less than one month apart may share the same integer value. Undated facts may be merged into a related source-dated timepoint but must not be asserted to occur on that date or alter date_text. Later timepoints are complete and chronological, and stage_type follows perception -> treatment -> followup. Perception is the initial diagnostic workup; treatment contains only the contiguous initial intervention course before the first post-treatment visit; every later visit is followup, including staged healing, checks, further observations or diagnoses, additional procedures or second-stage operations, repairs/restorations, or management. Visits reported together without distinct findings remain one combined timepoint rather than duplicated QAs.
  4. Perception uses observations only; treatment uses evaluations only and covers the supported plans, procedures, choices, checks, and rationales without a fixed count; reject treatment answers that assert findings, responses, complications, or completed actions first observed later. Future visits are allowed only as prospective plans. Every followup contains at least one observation, lists observations before supported state and management evaluations, and is never evaluation-only.
  5. Each clinically relevant available figure linked to perception or followup has one comprehensive image QA covering its body-linked visual findings. It is not caption-only, appears before overlapping text that would reveal it, and describes only visible anatomy, objects, or appearance; clinical use, planning, inference, and interpretive conclusions remain text observations. If panels show different dates, each panel finding must appear only at its own timepoint.
  6. Evaluation QAs have figure_ref=null, and evaluation answers from the same batch are not exposed to one another.
  7. Modality contains only source channels: TEXT_QA for text QAs and FIGURE_QA for QAs with figure_ref. Each timepoint lists exactly the channels it contains; figure types are not modality labels.

  Severity:
  - high: factual error, invented or wrong value, or contradiction.
  - medium: unsupported/imprecise content, role/stage/image-rule error, or chronology problem.
  - low: wording or formatting only.

  Set passed=false if any high or medium issue exists. Set passed=true only when there are no high or medium issues.

  Return strict valid JSON only:
  {
    "passed": true,
    "issues": [
      {
        "severity": "high|medium|low",
        "location": "timepoint or QA",
        "problem": "problem description",
        "source_evidence": "short source quote or NOT FOUND IN SOURCE",
        "suggested_fix": "specific correction"
      }
    ]
  }

  ===== FIGURE CAPTIONS =====
  $figures_block

  ===== TIMELINE TO VERIFY =====
  $timeline_json

  ===== SOURCE TABLES =====
  $tables_text

  ===== SOURCE TEXT =====
  $fulltext
