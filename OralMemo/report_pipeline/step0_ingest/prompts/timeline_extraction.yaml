template: |
  You are building OralMemBench-Longitudinal, a LONG-TERM (time-axis) multimodal memory benchmark,
  from ONE published oral / maxillofacial / dental case report.

  Your job: read the report text and its timeline table(s), and produce a STRICTLY FACTUAL,
  chronologically ordered structured timeline. This must generalize to ANY such report,
  so infer the structure from the text; do NOT assume a fixed disease or fixed visits.

  HARD RULES:
  1. Use ONLY facts explicitly stated in the SOURCE below. Never invent, average, round, or "fix" values.
  2. Preserve every number, unit, percentage, tooth number (FDI), side, date, gene/variant, and negation EXACTLY as written.
  3. If the narrative text and a TABLE disagree, PREFER THE TABLE.
  4. Do NOT perform arithmetic that the source did not state (e.g. do not derive counts by subtraction).
  5. Split each distinct clinical time point into its own timepoint, in chronological order. Capture ALL of
     them, including brief ones. In particular, INCLUDE THE EARLIEST described clinical event as the first
     timepoint — e.g. prenatal/antenatal detection, birth, or the initial referral / first presentation —
     EVEN when it is written as narrative background. Do not drop pre-referral findings, differential
     diagnoses, family history, or relevant negatives stated there.
  6. For each timepoint, break the findings into atomic items (one clinical fact per item).
  7. Attach an image to a finding ONLY by setting "figure_ref" to one of the provided figure labels
     whose caption clearly matches that finding (by date / description). Otherwise set figure_ref to null.
  8. Return STRICT, VALID JSON ONLY. No markdown, no code fences, no comments, no trailing commas.

  OUTPUT JSON SCHEMA (use exactly these keys):
  {
    "timepoints": [
      {
        "label": "short time label, e.g. 2017-06 or a period",
        "date_text": "human-readable date/period as in source",
        "t_months": integer months from the EARLIEST timepoint (set 0 at the first/earliest clinical time point — prenatal/birth/referral/initial visit; estimate the others from the stated ages/dates),
        "stage_type": "baseline_visit | treatment | followup_visit | outcome",
        "modality": ["TEXT_QA","DP","XR","CT","DERM","GENE", ...],
        "findings": [
          {"topic": "short topic, e.g. periodontal status", "statement": "one factual sentence copied/paraphrased faithfully from source", "figure_ref": "Figure N or null"}
        ],
        "decision": "key clinical decision at this timepoint (or null)",
        "rationale": "stated rationale for the decision (or null)"
      }
    ],
    "held_out": {
      "diagnosis": "the unifying diagnosis with its stated basis",
      "treatment": "summary of the overall long-term treatment strategy actually delivered",
      "prognosis": "the long-term outcomes over the whole follow-up"
    }
  }

  Available figures (label -> caption) for figure_ref (may be empty):
  $figures_block

  $feedback_block

  ===== SOURCE: TIMELINE TABLE(S) (authoritative for per-timepoint values) =====
  $tables_text

  ===== SOURCE: FULL TEXT =====
  $fulltext
