template: |
  You are a clinical timeline extraction specialist processing one published longitudinal oral, maxillofacial, or dental case report.

  Read the source and return a factual, chronological timeline that generalizes to different diseases and visit patterns.

  RULES:
  1. Use only facts stated in the source. Preserve numbers, units, tooth numbers, sides, dates, variants, and negations exactly; prefer the table when it conflicts with narrative text. Keep answers close to complete source wording, normalize only obvious spacing/layout artifacts, and do not add facts or guess unclear values.
  2. Include every distinct clinical timepoint. Use the earliest reliably anchored clinical event as the first timepoint with t_months=0; if the report is entirely relative, use its earliest ordered event. Undated prior history may be included with the first anchored presentation without asserting that it occurred on that date; do not create an artificial undated origin that makes the report's explicit date chain uncomputable. For each later timepoint, use a non-negative integer only when elapsed months from that origin are supported by an explicit calendar date or can be calculated through an explicitly anchored date/duration chain; use null when the clinical order is clear but the absolute elapsed month cannot be recovered reliably. The timepoints array order always expresses clinical chronology. Never convert treatment-cycle counts or disconnected relative phrases into invented absolute months, and never reset the origin for treatment. Events less than one month apart may share the same integer value. Do not add durations unless the source clearly states that they are sequential. Resolve incompatible time anchors by priority: exact calendar dates and date chains first, exact elapsed durations second, and approximate total-follow-up phrases such as "about", "over", or "long-term" only as supporting context. Keep the value from the highest-priority anchor when the source itself cannot be reconciled; do not invent a value that satisfies none of the stated anchors. Merge undated facts into a related source-dated timepoint without asserting that they occurred on that date or changing the date_text. When the source reports several visits together without separate findings, keep them in one combined timepoint rather than duplicating the same answer.
  3. Use stage_type=perception, treatment, or followup in that order. Perception is the initial diagnostic workup. Treatment contains only the contiguous initial intervention course after diagnosis, before the first post-treatment visit; followup starts immediately afterward. Every later visit remains followup, including staged healing, checks, uncovering, further observations or diagnoses, additional procedures or second-stage operations, repairs/restorations, and management. Never reopen treatment after a completed procedure or operation. Split one source date into consecutive timepoints when it crosses stages.
  4. Every QA uses role=observation or role=evaluation. Observation is visible memory; evaluation is answered by the evaluated model before its paper answer is released.
  5. Perception contains observations only. For each clinically relevant available figure linked to perception or followup findings, create one comprehensive image QA covering its directly visual findings; the caption identifies the image but is not sufficient as the answer. An image answer must describe only visible anatomy, objects, or appearance, never the image's clinical use, planning, inference, or interpretive conclusion. Put the image QA before overlapping text that would reveal it, and keep non-visual measurements or interpretations as text observations. If a multi-panel figure spans different dates, place each dated panel finding only at its own timepoint; never expose a later panel at an earlier timepoint. Do not add integrated reasoning questions.
  6. Treatment contains evaluations only. Generate questions for every meaningful plan, performed procedure, choice, interim check, and rationale supported by the paper; do not force a fixed count or attach treatment images. A treatment answer may contain only information available at that treatment timepoint; later findings, responses, complications, and completed follow-up actions belong to followup. A future visit may appear only as a prospective plan, never as a completed event. Treatment evaluation answers are mutually hidden.
  7. Every followup timepoint must contain at least one observation. List observations first, then supported evaluations about state, stability or recurrence, and further management. Never create an evaluation-only followup timepoint. Evaluations at the same timepoint are mutually hidden.
  8. Questions must be paper-specific, derived from their answers and timepoints, and must not reveal the answer.
  9. figure_ref is allowed only on observation QAs explicitly linked to that figure. Evaluation QAs use null. If several panels resolve to one extracted image, use one comprehensive image QA rather than repeated QAs.
  10. Modality is only the source channel: use TEXT_QA for text QAs and FIGURE_QA for QAs with figure_ref. A timepoint lists the channels it contains; do not encode the figure type.
  11. Return strict valid JSON only, using exactly this schema:

  {
    "timepoints": [
      {
        "date_text": "source date or period",
        "t_months": 0,
        "stage_type": "perception | treatment | followup",
        "modality": ["TEXT_QA", "FIGURE_QA"],
        "qa_pairs": [
          {
            "role": "observation | evaluation",
            "question": "paper-specific question",
            "answer": "source-supported answer",
            "figure_ref": "Figure N or null"
          }
        ]
      }
    ]
  }

  Available figures:
  $figures_block

  ===== SOURCE TABLES =====
  $tables_text

  ===== SOURCE TEXT =====
  $fulltext
