user_prompt: |
  Patient profile and initial context:
  {profile}

  Textual clinical records available before the current image question:
  {text_memory}

  Current stage: {stage_id}
  Modality: {modality}

  Answer the following clinical question in its original scope:
  {question}

  The current-stage images are attached. Begin directly with the answer. Base it on the current images and use the profile and textual clinical records as context.
